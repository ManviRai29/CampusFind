<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFind - Report an Item</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand"><span class="brand-icon">🎒</span> CampusFind</a>
      <div class="nav-actions">
        <span class="nav-user" id="navUsername"></span>
        <a href="dashboard.html" class="btn btn-outline btn-sm">← Dashboard</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container page-content">
    <h2 class="section-title">Report a Lost or Found Item</h2>
    <p class="section-subtitle">Fill in as much detail as possible to help match items with their owners.</p>

    <div class="panel" style="max-width:720px;">
      <div id="formAlert" class="alert alert-error"></div>

      <form id="itemForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="type">Report Type</label>
            <select id="type" required>
              <option value="Lost">Lost</option>
              <option value="Found">Found</option>
            </select>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Electronics">Electronics</option>
              <option value="Documents">Documents</option>
              <option value="Accessories">Accessories</option>
              <option value="Bags">Bags</option>
              <option value="Clothing">Clothing</option>
              <option value="Keys">Keys</option>
              <option value="Books">Books</option>
              <option value="Others">Others</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="name">Item Name</label>
          <input type="text" id="name" placeholder="e.g. Black Wallet" required />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Describe the item: color, brand, distinguishing marks..." required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Library, 2nd Floor" required />
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
        </div>

        <div class="form-group">
          <label for="image">Image URL <span style="font-weight:400; color:var(--text-muted);">(optional)</span></label>
          <input type="url" id="image" placeholder="https://example.com/photo.jpg" />
          <p class="hint">Leave blank to use an automatically generated placeholder image.</p>
        </div>

        <div class="form-group">
          <label for="contact">Contact Details</label>
          <input type="text" id="contact" placeholder="Email or phone number" required />
        </div>

        <div style="display:flex; gap:10px; margin-top:6px;">
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit Report</button>
          <a href="dashboard.html" class="btn btn-outline">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/addItem.js"></script>
</body>
</html>
