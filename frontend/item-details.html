<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFind - Item Details</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand"><span class="brand-icon">🎒</span> CampusFind</a>
      <div class="nav-actions">
        <span class="nav-user" id="navUsername"></span>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container page-content">
    <a href="dashboard.html" class="back-link">&larr; Back to dashboard</a>
    <div id="detailsArea">
      <div class="state-box"><p>Loading item...</p></div>
    </div>
  </main>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <h3>Delete this item?</h3>
      <p>This action cannot be undone. The report will be permanently removed.</p>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" id="cancelDeleteBtn">Cancel</button>
        <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/itemDetails.js"></script>
</body>
</html>
