<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusFind - Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand"><span class="brand-icon">🎒</span> CampusFind</a>
      <div class="nav-actions">
        <span class="nav-user" id="navUsername"></span>
        <a href="add-item.html" class="btn btn-primary btn-sm">+ Report Item</a>
        <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container page-content">
    <div class="dashboard-header">
      <div>
        <h1>Lost &amp; Found Items</h1>
        <p>Browse items reported by students across campus.</p>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search by name, description or location..." />
      <select id="typeFilter">
        <option value="All">All Types</option>
        <option value="Lost">Lost</option>
        <option value="Found">Found</option>
      </select>
      <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="Electronics">Electronics</option>
        <option value="Documents">Documents</option>
        <option value="Accessories">Accessories</option>
        <option value="Bags">Bags</option>
        <option value="Clothing">Clothing</option>
        <option value="Keys">Keys</option>
        <option value="Books">Books</option>
        <option value="Others">Others</option>
      </select>
      <button class="btn btn-outline btn-sm" id="clearFiltersBtn">Clear</button>
    </div>

    <p class="result-count" id="resultCount"></p>

    <div id="itemsArea">
      <div class="state-box"><p>Loading items...</p></div>
    </div>
  </main>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-box">
      <h3>Delete this item?</h3>
      <p>This action cannot be undone. The report will be permanently removed.</p>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" id="cancelDeleteBtn">Cancel</button>
        <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
